<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 460" width="1140" height="460" role="img" aria-label="VaultLineage Excalidraw Architecture Diagram">
  <defs>
    <marker id="exArrow" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10" fill="none" stroke="#18181B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="exArrowRed" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10" fill="none" stroke="#DC2626" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Excalidraw Cream Canvas + Subtle Sketch Double Border -->
  <rect x="4" y="4" width="1132" height="452" rx="8" fill="#FAF7F2" stroke="#18181B" stroke-width="2.5"/>
  <rect x="7" y="7" width="1126" height="446" rx="8" fill="none" stroke="#18181B" stroke-width="1" stroke-dasharray="10,4" opacity="0.45"/>

  <!-- Title Banner -->
  <rect x="24" y="20" width="204" height="30" rx="4" fill="#15803D" stroke="#18181B" stroke-width="2"/>
  <text x="126" y="40" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#FFFFFF">EXCALIDRAW ARCHITECTURE</text>
  <text x="244" y="41" font-family="sans-serif" font-size="15.5" font-weight="800" fill="#141413">VaultLineage — CloudFront + S3 (OAC) + SQLite KMS Envelope Store + Opt-Out Gate + RTBF</text>

  <!-- Column 1: Edge & VPC PII Gateway -->
  <g>
    <rect x="26" y="72" width="242" height="356" rx="8" fill="#FFFFFF" stroke="#18181B" stroke-width="2.2"/>
    <path d="M 28 75 L 266 73 L 267 426 L 25 427 Z" fill="none" stroke="#18181B" stroke-width="1" opacity="0.35"/>
    <rect x="38" y="84" width="218" height="28" rx="4" fill="#DCFCE7" stroke="#18181B" stroke-width="1.8"/>
    <text x="48" y="103" font-family="monospace" font-size="11" font-weight="700" fill="#15803D">01. CLOUDFRONT &amp; PII VAULT</text>

    <rect x="40" y="128" width="214" height="78" rx="6" fill="#FAF7F2" stroke="#18181B" stroke-width="2"/>
    <text x="52" y="150" font-family="sans-serif" font-size="13" font-weight="700" fill="#141413">Amazon CloudFront CDN</text>
    <text x="52" y="169" font-family="monospace" font-size="10.5" fill="#52514E">/* -&gt; Private S3 Bucket (OAC)</text>
    <text x="52" y="187" font-family="monospace" font-size="10.5" fill="#15803D">/api/* -&gt; AWS Lambda</text>

    <rect x="40" y="224" width="214" height="86" rx="6" fill="#DBEAFE" stroke="#18181B" stroke-width="2"/>
    <text x="52" y="246" font-family="sans-serif" font-size="13" font-weight="700" fill="#1E3A8A">VPC PII Vault Tokenizer</text>
    <text x="52" y="265" font-family="monospace" font-size="10.5" fill="#1E3A8A">SSN | EMAIL | AKIA | CARD | IP</text>
    <text x="52" y="283" font-family="monospace" font-size="10" fill="#141413">HMAC-SHA256 -&gt; &lt;PII:SSN:4d91&gt;</text>
    <text x="52" y="299" font-family="monospace" font-size="10" fill="#15803D">1,800 spans tokenized (0 leaks)</text>

    <rect x="40" y="328" width="214" height="82" rx="6" fill="#F2ECE1" stroke="#18181B" stroke-width="2"/>
    <text x="52" y="350" font-family="sans-serif" font-size="13" font-weight="700" fill="#141413">SHA-256 Audit Ledger</text>
    <text x="52" y="369" font-family="monospace" font-size="10" fill="#52514E">SQLite audit_ledger hash chain</text>
    <text x="52" y="387" font-family="monospace" font-size="10" fill="#15803D">1,374 / 1,374 entries verified</text>
  </g>

  <!-- Column 2: KMS Keyring & SQLite Envelope Store -->
  <g>
    <rect x="308" y="72" width="254" height="356" rx="8" fill="#FFFFFF" stroke="#18181B" stroke-width="2.2"/>
    <path d="M 310 74 L 560 73 L 561 426 L 307 427 Z" fill="none" stroke="#18181B" stroke-width="1" opacity="0.35"/>
    <rect x="320" y="84" width="230" height="28" rx="4" fill="#DCFCE7" stroke="#18181B" stroke-width="1.8"/>
    <text x="330" y="103" font-family="monospace" font-size="11" font-weight="700" fill="#15803D">02. SQLITE ENVELOPE STORE</text>

    <rect x="322" y="128" width="226" height="86" rx="6" fill="#DCFCE7" stroke="#18181B" stroke-width="2"/>
    <text x="334" y="150" font-family="sans-serif" font-size="13" font-weight="700" fill="#14532D">Per-Tenant KMS Keyring</text>
    <text x="334" y="169" font-family="monospace" font-size="10.5" fill="#14532D">CMK -&gt; Wrapped 256-bit DEK</text>
    <text x="334" y="187" font-family="monospace" font-size="10" fill="#141413">AAD: tenant|event|cmk_arn</text>
    <text x="334" y="203" font-family="monospace" font-size="10" fill="#15803D">5,182.4 ev/s (0.164 ms p50)</text>

    <rect x="322" y="230" width="226" height="84" rx="6" fill="#FAF7F2" stroke="#18181B" stroke-width="2"/>
    <text x="334" y="252" font-family="sans-serif" font-size="13" font-weight="700" fill="#141413">SQLite WAL Event Partitions</text>
    <text x="334" y="271" font-family="monospace" font-size="10.5" fill="#52514E">raw_envelope (Auditor Only)</text>
    <text x="334" y="289" font-family="monospace" font-size="10.5" fill="#15803D">sanitized_envelope (ML Safe)</text>
    <text x="334" y="304" font-family="monospace" font-size="9.5" fill="#52514E">idx_events_tenant_status</text>

    <rect x="322" y="330" width="226" height="80" rx="6" fill="#FEF3C7" stroke="#18181B" stroke-width="2"/>
    <text x="334" y="352" font-family="sans-serif" font-size="13" font-weight="700" fill="#92400E">Live Consent Control Plane</text>
    <text x="334" y="370" font-family="monospace" font-size="10" fill="#92400E">ALLOW_ML | OPTOUT_ML | ZERO_RET</text>
    <text x="334" y="388" font-family="monospace" font-size="10" fill="#141413">Instant SQL shard eviction</text>
  </g>

  <!-- Column 3: Opt-Out Gate & ML Snapshot Platform -->
  <g>
    <rect x="602" y="72" width="250" height="356" rx="8" fill="#FFFFFF" stroke="#18181B" stroke-width="2.2"/>
    <path d="M 604 74 L 850 73 L 851 426 L 601 427 Z" fill="none" stroke="#18181B" stroke-width="1" opacity="0.35"/>
    <rect x="614" y="84" width="226" height="28" rx="4" fill="#DCFCE7" stroke="#18181B" stroke-width="1.8"/>
    <text x="624" y="103" font-family="monospace" font-size="11" font-weight="700" fill="#15803D">03. OPT-OUT &amp; PURPOSE GATE</text>

    <rect x="616" y="128" width="222" height="88" rx="6" fill="#D1FAE5" stroke="#18181B" stroke-width="2"/>
    <text x="628" y="150" font-family="sans-serif" font-size="13" font-weight="700" fill="#065F46">Purpose-Bound Access Gate</text>
    <text x="628" y="168" font-family="monospace" font-size="10" fill="#065F46">ml_scientist -&gt; SFT / LoRA</text>
    <text x="628" y="185" font-family="monospace" font-size="10" fill="#065F46">analytics_eng -&gt; Rollups (403 ML)</text>
    <text x="628" y="203" font-family="monospace" font-size="10" fill="#141413">0.028 ms p50 · 100% Block Rate</text>

    <rect x="616" y="232" width="222" height="84" rx="6" fill="#FAF7F2" stroke="#18181B" stroke-width="2"/>
    <text x="628" y="254" font-family="sans-serif" font-size="13" font-weight="700" fill="#141413">Compliant ML Snapshots</text>
    <text x="628" y="273" font-family="monospace" font-size="10" fill="#15803D">0.0% Opt-Out Leakage (0/1,200)</text>
    <text x="628" y="290" font-family="monospace" font-size="10" fill="#52514E">15.09 ms SQLite JOIN build</text>
    <text x="628" y="306" font-family="monospace" font-size="9.5" fill="#52514E">Manifest SHA-256 Sealed</text>

    <rect x="616" y="332" width="222" height="78" rx="6" fill="#EDE9FE" stroke="#18181B" stroke-width="2"/>
    <text x="628" y="354" font-family="sans-serif" font-size="13" font-weight="700" fill="#5B21B6">Downstream Lineage Shards</text>
    <text x="628" y="372" font-family="monospace" font-size="10" fill="#5B21B6">fs-prompt-embeddings-v2</text>
    <text x="628" y="389" font-family="monospace" font-size="10" fill="#5B21B6">ft-lora-adapter-checkpoint-v1</text>
  </g>

  <!-- Column 4: GDPR/CCPA Crypto-Shredding & Bedrock Nova -->
  <g>
    <rect x="892" y="72" width="224" height="356" rx="8" fill="#FFFFFF" stroke="#18181B" stroke-width="2.2"/>
    <path d="M 894 74 L 1114 73 L 1115 426 L 891 427 Z" fill="none" stroke="#18181B" stroke-width="1" opacity="0.35"/>
    <rect x="904" y="84" width="200" height="28" rx="4" fill="#FEE2E2" stroke="#18181B" stroke-width="1.8"/>
    <text x="914" y="103" font-family="monospace" font-size="11" font-weight="700" fill="#DC2626">04. CRYPTO-SHRED RTBF</text>

    <rect x="906" y="128" width="196" height="88" rx="6" fill="#FEE2E2" stroke="#18181B" stroke-width="2"/>
    <text x="918" y="150" font-family="sans-serif" font-size="13" font-weight="700" fill="#991B1B">GDPR Art.17 / CCPA API</text>
    <text x="918" y="168" font-family="monospace" font-size="10" fill="#991B1B">1. Zeroize 256-bit DEK</text>
    <text x="918" y="185" font-family="monospace" font-size="10" fill="#991B1B">2. Purge 100% SQL Lineage</text>
    <text x="918" y="203" font-family="monospace" font-size="10" fill="#141413">2.805 ms mean · 0 residual</text>

    <rect x="906" y="232" width="196" height="82" rx="6" fill="#FAF7F2" stroke="#18181B" stroke-width="2"/>
    <text x="918" y="254" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#141413">Signed Deletion Certificate</text>
    <text x="918" y="273" font-family="monospace" font-size="10" fill="#52514E">Merkle Proof + HMAC-SHA256</text>
    <text x="918" y="291" font-family="monospace" font-size="10" fill="#15803D">180/180 blocks undecipherable</text>

    <rect x="906" y="330" width="196" height="80" rx="6" fill="#DBEAFE" stroke="#18181B" stroke-width="2"/>
    <text x="918" y="352" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#1E40AF">Amazon Bedrock Nova</text>
    <text x="918" y="370" font-family="monospace" font-size="10" fill="#1E40AF">us.amazon.nova-lite-v1:0</text>
    <text x="918" y="388" font-family="monospace" font-size="10" fill="#141413">Live Auditor Memo (2.92s p50)</text>
  </g>

  <!-- Excalidraw Curved Sketch Connectors -->
  <path d="M 268 258 Q 288 252 305 258" fill="none" stroke="#18181B" stroke-width="2.4" marker-end="url(#exArrow)"/>
  <path d="M 562 258 Q 582 252 599 258" fill="none" stroke="#18181B" stroke-width="2.4" marker-end="url(#exArrow)"/>
  <path d="M 906 168 Q 875 215 842 262" fill="none" stroke="#DC2626" stroke-width="2.2" stroke-dasharray="6,4" marker-end="url(#exArrowRed)"/>
  <path d="M 912 128 C 790 48, 560 48, 442 124" fill="none" stroke="#DC2626" stroke-width="2.2" stroke-dasharray="6,4" marker-end="url(#exArrowRed)"/>
</svg>
